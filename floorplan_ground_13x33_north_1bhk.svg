<svg xmlns="http://www.w3.org/2000/svg" width="320" height="720" viewBox="0 0 320 720">
  <!-- Scale: 1 ft = 20 px; Plot: 13' x 33' => 260 x 660 px; 20 px margin -->
  <defs>
    <style>
      .outline { fill: none; stroke: #111; stroke-width: 2; }
      .wall { fill: none; stroke: #111; stroke-width: 3; }
      .label { font: 12px sans-serif; fill: #111; }
      .title { font: 14px sans-serif; font-weight: bold; fill: #111; }
    </style>
  </defs>

  <!-- Border and title -->
  <rect x="10" y="10" width="300" height="700" class="outline"/>
  <text x="160" y="28" text-anchor="middle" class="title">Ground Floor - 1BHK + Parking (13' x 33', North up)</text>

  <!-- Plot boundary -->
  <rect x="30" y="30" width="260" height="660" class="wall"/>

  <!-- North arrow -->
  <polygon points="290,36 296,48 284,48" fill="#111"/>
  <text x="290" y="62" text-anchor="middle" class="label">N</text>

  <!-- Car Parking Zone (front, north) 14' deep -->
  <rect x="30" y="30" width="260" height="280" fill="#e7f3ff" stroke="#111"/>
  <text x="160" y="170" text-anchor="middle" class="label">Car Parking ~10' x 14'</text>
  <!-- Stair along west side within parking, 3' wide -->
  <rect x="30" y="30" width="60" height="280" fill="#d9d9d9" stroke="#111"/>
  <text x="60" y="175" text-anchor="middle" class="label" transform="rotate(-90 60,175)">Stair 3' wide</text>

  <!-- Living/Dining 10' deep -->
  <rect x="30" y="310" width="260" height="200" fill="#ffe7cd" stroke="#111"/>
  <text x="160" y="410" text-anchor="middle" class="label">Living / Dining 13' x 10'</text>

  <!-- Kitchen (open/SE corner of living) 7' x 6' -->
  <rect x="150" y="390" width="140" height="120" fill="#fff1e0" stroke="#b36b00"/>
  <text x="220" y="450" text-anchor="middle" class="label">Kitchen 7' x 6'</text>

  <!-- Rear zone: Bedroom + Bath -->
  <!-- Common Bath 4' x 6' (west side) -->
  <rect x="30" y="510" width="80" height="120" fill="#e0f7f1" stroke="#0b6b53"/>
  <text x="70" y="570" text-anchor="middle" class="label" transform="rotate(-90 70,570)">Bath 4' x 6'</text>

  <!-- Bedroom 9' x 9' (east of bath) -->
  <rect x="110" y="510" width="180" height="180" fill="#e9f0ff" stroke="#1b3aa5"/>
  <text x="200" y="600" text-anchor="middle" class="label">Bedroom 9' x 9'</text>

  <!-- Annotations -->
  <text x="160" y="702" text-anchor="middle" class="label">All sizes approximate; walls ~4-6" not to scale.</text>
</svg>

